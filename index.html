                { title: "Pattern Plotter 调色板", url: "17-案例-PatternPlotter/04-palette-editor.html", description: "调色板编辑器，色彩管理工具界面。" },
                { title: "Pattern Plotter 故障态", url: "17-案例-PatternPlotter/05-system-failure.html", description: "系统故障错误页面，工具美学错误态设计。" },
                { title: "Pattern Plotter 植物图案", url: "17-案例-PatternPlotter/06-flora-pattern.html", description: "植物图案生成器，Canvas 2D 图案绘制。" },
            ]},
        ];

        const root = document.getElementById('gallery-root');
        const tabBar = document.getElementById('tab-bar');

        function makeCard(asset, isComingSoon) {
            const card = document.createElement('div');
            card.className = 'glass-card rounded-2xl p-4 flex flex-col transition-transform duration-300 hover:-translate-y-1 h-full';
            const preview = isComingSoon
                ? `<div class="absolute inset-0 flex items-center justify-center"><span class="text-gray-600 text-xs font-mono border border-gray-800 px-3 py-1 rounded-full">COMING SOON</span></div>`
                : `<iframe src="${asset.url}" loading="lazy" class="absolute top-0 left-0 w-[200%] h-[200%] origin-top-left scale-50 pointer-events-none" frameborder="0" scrolling="no"></iframe>
                   <div class="absolute inset-0 bg-black/20 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center pointer-events-none">
                       <span class="text-[#c2ff00] text-xs font-mono bg-black/80 px-3 py-1 rounded-full backdrop-blur-md border border-[#c2ff00]/30">LIVE PREVIEW</span>
                   </div>`;
            const actions = isComingSoon
                ? `<div class="flex gap-2 mt-auto"><span class="flex-1 text-center bg-gray-900 text-gray-600 py-2 rounded-lg text-xs font-semibold border border-gray-800">即将上线</span></div>`
                : `<div class="flex gap-2 mt-auto">
                       <a href="${asset.url}" target="_blank" class="flex-1 text-center accent-bg accent-hover py-2 rounded-lg text-xs font-semibold transition-colors cursor-pointer text-black">👀 全屏</a>
                       <button onclick="copyCode('${asset.url}', this)" class="flex-1 text-center bg-gray-800 hover:bg-gray-700 text-white py-2 rounded-lg text-xs font-semibold transition-colors border border-gray-700">📋 复制</button>
                   </div>`;
            card.innerHTML = `
                <div class="relative w-full h-48 mb-4 rounded-xl overflow-hidden bg-[#0a0a0a] border border-gray-800 group shrink-0">${preview}</div>
                <div class="flex flex-col flex-1 justify-between">
                    <div>
                        ${asset.category ? `<div class="text-[10px] font-mono text-gray-500 mb-2 border border-gray-800 inline-block px-2 py-0.5 rounded-full">${asset.category}</div>` : ''}
                        <h2 class="text-lg font-semibold mb-2 leading-tight">${asset.title}</h2>
                        <p class="text-gray-500 text-xs mb-4 leading-relaxed line-clamp-2">${asset.description}</p>
                    </div>
                    ${actions}
                </div>`;
            return card;
        }

        function showTab(activeId) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.id === activeId));
            root.innerHTML = '';
            const section = sections.find(s => s.id === activeId);
            const grid = document.createElement('div');
            grid.className = 'grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mt-8';
            section.items.forEach(asset => grid.appendChild(makeCard({...asset, category: section.label}, section.coming || !asset.url)));
            root.appendChild(grid);
        }

        sections.forEach((section, i) => {
            const btn = document.createElement('button');
            btn.className = 'tab-btn' + (i === 0 ? ' active' : '');
            btn.dataset.id = section.id;
            btn.textContent = section.label;
            btn.onclick = () => showTab(section.id);
            tabBar.appendChild(btn);
        });

        showTab(sections[0].id);

        function handleSearch(q) {
            const clear = document.getElementById('search-clear');
            q = q.trim().toLowerCase();
            clear.classList.toggle('hidden', !q);
            if (!q) { showTab(sections[0].id); return; }

            // 搜索时隐藏 tab 激活态，直接渲染匹配结果
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            const allItems = sections.flatMap(s => s.items.map(item => ({ ...item, category: s.label, coming: s.coming })));
            const matched = allItems.filter(item =>
                item.title.toLowerCase().includes(q) ||
                item.description.toLowerCase().includes(q) ||
                item.category.toLowerCase().includes(q) ||
                item.url.toLowerCase().includes(q)
            );

            const root = document.getElementById('gallery-root');
            root.innerHTML = '';
            if (!matched.length) {
                root.innerHTML = '<p class="text-gray-600 text-sm">No results found.</p>';
                return;
            }
            const grid = document.createElement('div');
            grid.className = 'grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6';
            matched.forEach(item => grid.appendChild(makeCard(item, item.coming || !item.url)));
            root.appendChild(grid);
        }

        function clearSearch() {
            const input = document.getElementById('search-input');
            input.value = '';
            handleSearch('');
        }

        async function copyCode(url, btnElement) {
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('文件未找到');
                const text = await response.text();
                await navigator.clipboard.writeText(text);
                const originalText = btnElement.innerHTML;
                btnElement.innerHTML = '✅ 已复制!';
                btnElement.classList.replace('bg-gray-800', 'accent-bg');
                btnElement.classList.replace('text-white', 'text-black');
                setTimeout(() => {
                    btnElement.innerHTML = originalText;
                    btnElement.classList.replace('accent-bg', 'bg-gray-800');
                    btnElement.classList.replace('text-black', 'text-white');
                }, 2000);
            } catch (err) {
                alert('复制失败！因为你还没有把这个动效的 HTML 文件放进对应的文件夹里哦。');
                console.error('Copy failed:', err);
            }
        }
    </script>
</body>
</html>
