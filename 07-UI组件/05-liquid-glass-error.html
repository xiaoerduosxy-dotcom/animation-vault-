<html lang="en" vid="0"><head vid="1">
    <meta charset="UTF-8" vid="2">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" vid="3">
    <title vid="4">Liquid Glass Component - Error State</title>
    <style vid="5">
        :root {
            --bg-color: #F6F6F9;
            --ui-text: #6B6B78;
            --ui-text-dim: #A0A0B0;
            --ui-border: rgba(0, 0, 0, 0.06);
            --ui-accent: #000000;
            --ui-error: #FF3B30;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 50% 0%, #FFFFFF 0%, transparent 70%),
                radial-gradient(circle at 50% 100%, #EAEAF2 0%, transparent 70%);
        }

        .component-wrapper {
            position: relative;
            width: 480px;
            height: 600px;
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid var(--ui-border);
            border-radius: 12px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            box-shadow: 
                0 20px 40px rgba(0,0,0,0.02),
                0 1px 3px rgba(0,0,0,0.01),
                inset 0 1px 0 rgba(255,255,255,0.8);
            z-index: 10;
        }

        .component-header {
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--ui-border);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--ui-text);
        }

        .header-left {
            display: flex;
            gap: 16px;
        }

        .status-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background-color: var(--ui-error);
            border-radius: 50%;
            margin-right: 6px;
            box-shadow: 0 0 8px var(--ui-error);
            animation: pulse-error 1.5s infinite;
        }

        @keyframes pulse-error {
            0% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
            100% { opacity: 0.3; transform: scale(1); }
        }

        .header-right {
            color: var(--ui-text-dim);
        }

        .canvas-container {
            flex-grow: 1;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: not-allowed;
        }

        #webgl-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; 
            opacity: 0.6;
        }

        .reticle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 320px;
            height: 320px;
            border: 1px dashed rgba(255, 59, 48, 0.15);
            border-radius: 50%;
            pointer-events: none;
        }

        .error-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            z-index: 5;
        }

        .error-code {
            font-size: 10px;
            color: var(--ui-error);
            letter-spacing: 0.2em;
            margin-bottom: 8px;
        }

        .component-footer {
            padding: 16px 20px;
            border-top: 1px solid var(--ui-border);
            display: flex;
            justify-content: space-between;
            font-size: 9px;
            color: var(--ui-text);
            letter-spacing: 0.05em;
        }

        .metric-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .metric-label {
            color: var(--ui-text-dim);
        }

        .metric-value {
            color: var(--ui-text-dim);
            font-weight: 600;
        }

        .corner {
            position: absolute;
            width: 8px;
            height: 8px;
            border: 1px solid var(--ui-border);
            pointer-events: none;
        }
        .corner-tl { top: -1px; left: -1px; border-right: none; border-bottom: none; border-radius: 12px 0 0 0; }
        .corner-tr { top: -1px; right: -1px; border-left: none; border-bottom: none; border-radius: 0 12px 0 0; }
        .corner-bl { bottom: -1px; left: -1px; border-right: none; border-top: none; border-radius: 0 0 0 12px; }
        .corner-br { bottom: -1px; right: -1px; border-left: none; border-top: none; border-radius: 0 0 12px 0; }

    </style>
</head>
<body vid="6">

    <div class="component-wrapper" vid="7">
        <div class="corner corner-tl" vid="8"></div>
        <div class="corner corner-tr" vid="9"></div>
        <div class="corner corner-bl" vid="10"></div>
        <div class="corner corner-br" vid="11"></div>

        <div class="component-header" vid="12">
            <div class="header-left" vid="13">
                <span vid="14"><span class="status-dot" vid="15"></span>SYS.OFFLINE</span>
                <span vid="16">OBJ.ERR_CONNECTION_LOST</span>
            </div>
            <div class="header-right" vid="17">
                DISPERSION_MODEL: NULL
            </div>
        </div>

        <div class="canvas-container" id="interaction-zone" vid="18">
            <div class="reticle" vid="19"></div>
            <div class="error-overlay" vid="20">
                <div class="error-code" vid="21">E_TIMEOUT_0x0042</div>
            </div>
            <canvas id="webgl-canvas" vid="22"></canvas>
        </div>

        <div class="component-footer" vid="23">
            <div class="metric-group" vid="24">
                <span class="metric-label" vid="25">TENSION</span>
                <span class="metric-value" vid="26">--.--</span>
            </div>
            <div class="metric-group" vid="27">
                <span class="metric-label" vid="28">REFRACTION_IDX</span>
                <span class="metric-value" vid="29">--.--</span>
            </div>
            <div class="metric-group" vid="30">
                <span class="metric-label" vid="31">VORTICITY</span>
                <span class="metric-value" vid="32">--.--</span>
            </div>
            <div class="metric-group" style="text-align: right;" vid="33">
                <span class="metric-label" vid="34">INTERACTION</span>
                <span class="metric-value" style="color: var(--ui-error);" vid="35">SIGNAL_LOST</span>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" vid="36"></script>

    <script vid="37">
        const canvas = document.getElementById('webgl-canvas');
        const container = document.getElementById('interaction-zone');

        const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        
        const scene = new THREE.Scene();
        
        const aspect = container.clientWidth / container.clientHeight;
        const frustumSize = 4;
        const camera = new THREE.OrthographicCamera(
            frustumSize * aspect / - 2, frustumSize * aspect / 2, 
            frustumSize / 2, frustumSize / - 2, 
            0.1, 100
        );
        camera.position.set(0, 0, 5);

        
        const geometry = new THREE.IcosahedronGeometry(1.2, 8); 
        const wireframeMaterial = new THREE.MeshBasicMaterial({
            color: 0x000000,
            wireframe: true,
            transparent: true,
            opacity: 0.05
        });
        
        const ghostMesh = new THREE.Mesh(geometry, wireframeMaterial);
        scene.add(ghostMesh);

        
        const pointsGeometry = new THREE.IcosahedronGeometry(1.21, 4);
        const pointsMaterial = new THREE.PointsMaterial({
            color: 0xFF3B30,
            size: 0.015,
            transparent: true,
            opacity: 0.1
        });
        const ghostPoints = new THREE.Points(pointsGeometry, pointsMaterial);
        scene.add(ghostPoints);

        function resize() {
            const width = container.clientWidth;
            const height = container.clientHeight;
            renderer.setSize(width, height);
            
            const aspect = width / height;
            camera.left = -frustumSize * aspect / 2;
            camera.right = frustumSize * aspect / 2;
            camera.top = frustumSize / 2;
            camera.bottom = -frustumSize / 2;
            camera.updateProjectionMatrix();
        }
        
        window.addEventListener('resize', resize);
        resize(); 

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            
            ghostMesh.rotation.y = elapsedTime * 0.1;
            ghostMesh.rotation.x = Math.sin(elapsedTime * 0.5) * 0.1;
            ghostMesh.position.y = Math.cos(elapsedTime * 0.8) * 0.05;

            ghostPoints.rotation.y = -elapsedTime * 0.15;
            ghostPoints.rotation.x = Math.cos(elapsedTime * 0.4) * 0.08;
            ghostPoints.position.y = ghostMesh.position.y;

            
            wireframeMaterial.opacity = 0.05 + Math.sin(elapsedTime * 10.0) * 0.01;

            renderer.render(scene, camera);
        }

        animate();
    </script>

</body></html>
