    <style vid="6">
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500&display=swap');

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: #E5E5E5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        @keyframes float1 {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(5px, -15px) rotate(5deg); }
            66% { transform: translate(-5px, -10px) rotate(-5deg); }
        }
        @keyframes float-subtle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        @keyframes blob-pulse {
            0%, 100% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; }
            50% { border-radius: 30% 60% 70% 40% / 50% 60% 30% 60%; }
        }

        .animate-float-1 { animation: float1 6s ease-in-out infinite; }
        .animate-float-subtle { animation: float-subtle 4s ease-in-out infinite; }
        .animate-blob { animation: blob-pulse 8s ease-in-out infinite; }

        .glass-card {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 32px rgba(0,0,0,0.02);
        }

        .chart-fill-light { background: linear-gradient(180deg, #FDE68A 0%, #FBBF24 100%); }
        .chart-fill-quiet { background: linear-gradient(180deg, #BFDBFE 0%, #60A5FA 100%); }
        .chart-fill-stuck { background: linear-gradient(180deg, #FFEDD5 0%, #FB923C 100%); }
        .chart-fill-overload { background: linear-gradient(180deg, #F3E8FF 0%, #C084FC 100%); }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
