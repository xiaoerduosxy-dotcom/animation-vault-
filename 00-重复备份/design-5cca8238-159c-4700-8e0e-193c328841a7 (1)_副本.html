<html lang="en" vid="0"><head vid="1">
    <meta charset="UTF-8" vid="2">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" vid="3">
    <title vid="4">AI Core Dot Matrix</title>
    <script src="https://cdn.tailwindcss.com/3.4.17" vid="5"></script>
    <style vid="6">
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap');

        body {
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'JetBrains Mono', monospace;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.05);
            transition: background-color 0.05s ease-out, box-shadow 0.05s ease-out;
            will-change: background-color, box-shadow;
        }

        .matrix-container {
            background: linear-gradient(145deg, #111111, #0a0a0a);
            box-shadow: 
                inset 0 0 40px rgba(0, 0, 0, 0.8),
                inset 0 2px 4px rgba(255,255,255,0.05),
                0 20px 50px -10px rgba(0,0,0,0.5);
        }

        .crt-scanline {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.1) 50%,
                rgba(0,0,0,0.1)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
            opacity: 0.3;
        }

        .glass-panel {
            background: rgba(15, 15, 17, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
    </style>
</head>
<body class="w-full h-full flex items-center justify-center p-4" vid="7">

    
    <div class="relative w-[600px] h-[600px] rounded-[16px] bg-[#09090b] overflow-hidden flex flex-col items-center justify-between p-6 shadow-2xl border border-neutral-800" id="widget-container" vid="8">
        
        
        <div id="ambient-glow" class="absolute inset-0 opacity-20 transition-colors duration-1000 ease-in-out pointer-events-none" style="background: radial-gradient(circle at center, rgba(6, 182, 212, 0.5) 0%, transparent 70%);" vid="9"></div>

        
        <header class="w-full flex justify-between items-start z-20" vid="10">
            <div vid="11">
                <h1 class="text-neutral-200 font-bold text-lg tracking-widest uppercase flex items-center gap-2" vid="12">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-neutral-500" vid="13"><polygon points="12 2 2 7 12 12 22 7 12 2" vid="14"></polygon><polyline points="2 17 12 22 22 17" vid="15"></polyline><polyline points="2 12 12 17 22 12" vid="16"></polyline></svg>
                    NEXUS Core
                </h1>
                <p id="status-label" class="text-cyan-400 text-xs mt-1 uppercase tracking-widest transition-colors duration-300 font-bold" vid="17">System Standby</p>
            </div>
            <div class="flex flex-col items-end" vid="18">
                <div class="flex items-center gap-2" vid="19">
                    <div id="status-dot" class="w-2.5 h-2.5 rounded-full bg-cyan-400 shadow-[0_0_8px_rgba(6,182,212,0.8)] animate-pulse transition-colors duration-300" vid="20"></div>
                    <span class="text-neutral-500 text-xs uppercase tracking-wider" vid="21">Status</span>
                </div>
                <p id="status-desc" class="text-neutral-500 text-[10px] mt-1 max-w-[150px] text-right leading-tight" vid="22">Idling. Awaiting input protocols.</p>
            </div>
        </header>

        
        <div class="relative z-20 flex-1 flex items-center justify-center w-full my-6" vid="23">
            <div class="relative p-6 rounded-2xl matrix-container border border-neutral-800/80" vid="24">
                
                <div class="absolute top-0 left-0 w-4 h-4 border-t-2 border-l-2 border-neutral-600 rounded-tl-lg" vid="25"></div>
                <div class="absolute top-0 right-0 w-4 h-4 border-t-2 border-r-2 border-neutral-600 rounded-tr-lg" vid="26"></div>
                <div class="absolute bottom-0 left-0 w-4 h-4 border-b-2 border-l-2 border-neutral-600 rounded-bl-lg" vid="27"></div>
                <div class="absolute bottom-0 right-0 w-4 h-4 border-b-2 border-r-2 border-neutral-600 rounded-br-lg" vid="28"></div>
                
                <div class="crt-scanline rounded-xl" vid="29"></div>
                
                <div id="dot-matrix" class="grid gap-1 relative z-10" style="grid-template-columns: repeat(25, 1fr);" vid="30">
                    
                </div>
            </div>
        </div>

        
        <footer class="w-full z-20 glass-panel rounded-xl p-2" vid="31">
            <div class="grid grid-cols-4 gap-2" vid="32">
                
                <button onclick="setState('standby')" id="btn-standby" class="state-btn relative flex flex-col items-center justify-center py-3 px-2 rounded-lg border transition-all duration-200 border-cyan-500/50 bg-cyan-950/30 text-cyan-400 hover:bg-cyan-900/40" vid="33">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mb-1.5" vid="34"><path d="M18.36 6.64a9 9 0 1 1-12.73 0" vid="35"></path><line x1="12" y1="2" x2="12" y2="12" vid="36"></line></svg>
                    <span class="text-[10px] uppercase tracking-wider font-bold" vid="37">Standby</span>
                </button>

                
                <button onclick="setState('thinking')" id="btn-thinking" class="state-btn relative flex flex-col items-center justify-center py-3 px-2 rounded-lg border border-transparent text-neutral-500 hover:text-neutral-300 hover:bg-white/5 transition-all duration-200" vid="38">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mb-1.5" vid="39"><rect x="4" y="4" width="16" height="16" rx="2" ry="2" vid="40"></rect><rect x="9" y="9" width="6" height="6" vid="41"></rect><line x1="9" y1="1" x2="9" y2="4" vid="42"></line><line x1="15" y1="1" x2="15" y2="4" vid="43"></line><line x1="9" y1="20" x2="9" y2="23" vid="44"></line><line x1="15" y1="20" x2="15" y2="23" vid="45"></line><line x1="20" y1="9" x2="23" y2="9" vid="46"></line><line x1="20" y1="14" x2="23" y2="14" vid="47"></line><line x1="1" y1="9" x2="4" y2="9" vid="48"></line><line x1="1" y1="14" x2="4" y2="14" vid="49"></line></svg>
                    <span class="text-[10px] uppercase tracking-wider font-bold" vid="50">Thinking</span>
                </button>

                
                <button onclick="setState('listening')" id="btn-listening" class="state-btn relative flex flex-col items-center justify-center py-3 px-2 rounded-lg border border-transparent text-neutral-500 hover:text-neutral-300 hover:bg-white/5 transition-all duration-200" vid="51">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mb-1.5" vid="52"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z" vid="53"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2" vid="54"></path><line x1="12" y1="19" x2="12" y2="23" vid="55"></line><line x1="8" y1="23" x2="16" y2="23" vid="56"></line></svg>
                    <span class="text-[10px] uppercase tracking-wider font-bold" vid="57">Listening</span>
                </button>

                
                <button onclick="setState('alert')" id="btn-alert" class="state-btn relative flex flex-col items-center justify-center py-3 px-2 rounded-lg border border-transparent text-neutral-500 hover:text-neutral-300 hover:bg-white/5 transition-all duration-200" vid="58">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mb-1.5" vid="59"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z" vid="60"></path><line x1="12" y1="9" x2="12" y2="13" vid="61"></line><line x1="12" y1="17" x2="12.01" y2="17" vid="62"></line></svg>
                    <span class="text-[10px] uppercase tracking-wider font-bold" vid="63">Alert</span>
                </button>
            </div>
        </footer>
    </div>

    <script vid="64">
        
        const config = {
            standby: { 
                r: 6, g: 182, b: 212, 
                label: 'System Standby',
                desc: 'Idling. Awaiting input protocols.',
                colorClass: 'text-cyan-400',
                bgClass: 'bg-cyan-400',
                shadowClass: 'shadow-[0_0_8px_rgba(6,182,212,0.8)]',
                btnBorder: 'border-cyan-500/50',
                btnBg: 'bg-cyan-950/30'
            },
            thinking: { 
                r: 168, g: 85, b: 247, 
                label: 'Processing',
                desc: 'Analyzing context and formulating response.',
                colorClass: 'text-purple-400',
                bgClass: 'bg-purple-400',
                shadowClass: 'shadow-[0_0_8px_rgba(168,85,247,0.8)]',
                btnBorder: 'border-purple-500/50',
                btnBg: 'bg-purple-950/30'
            },
            listening: { 
                r: 16, g: 185, b: 129, 
                label: 'Audio Input Active',
                desc: 'Microphone open. Processing audio stream.',
                colorClass: 'text-emerald-400',
                bgClass: 'bg-emerald-400',
                shadowClass: 'shadow-[0_0_8px_rgba(16,185,129,0.8)]',
                btnBorder: 'border-emerald-500/50',
                btnBg: 'bg-emerald-950/30'
            },
            alert: { 
                r: 244, g: 63, b: 94, 
                label: 'System Alert',
                desc: 'Critical priority override detected.',
                colorClass: 'text-rose-400',
                bgClass: 'bg-rose-400',
                shadowClass: 'shadow-[0_0_8px_rgba(244,63,94,0.8)]',
                btnBorder: 'border-rose-500/50',
                btnBg: 'bg-rose-950/30'
            }
        };

        
        const matrixEl = document.getElementById('dot-matrix');
        const gridSize = 25; 
        const center = Math.floor(gridSize / 2); 
        const dots = [];

        for (let y = 0; y < gridSize; y++) {
            for (let x = 0; x < gridSize; x++) {
                const dot = document.createElement('div');
                dot.className = 'dot';
                matrixEl.appendChild(dot);

                const dx = x - center;
                const dy = y - center;
                const distance = Math.sqrt(dx * dx + dy * dy);
                const angle = Math.atan2(dy, dx);

                dots.push({ el: dot, x: dx, y: dy, d: distance, a: angle });
            }
        }

        
        let currentState = 'standby';

        window.setState = function(state) {
            currentState = state;
            const cfg = config[state];

            
            const statusLabel = document.getElementById('status-label');
            statusLabel.textContent = cfg.label;
            statusLabel.className = `text-xs mt-1 uppercase tracking-widest transition-colors duration-300 font-bold ${cfg.colorClass}`;
            
            document.getElementById('status-desc').textContent = cfg.desc;

            
            const statusDot = document.getElementById('status-dot');
            statusDot.className = `w-2.5 h-2.5 rounded-full animate-pulse transition-colors duration-300 ${cfg.bgClass} ${cfg.shadowClass}`;

            
            const ambientGlow = document.getElementById('ambient-glow');
            ambientGlow.style.background = `radial-gradient(circle at center, rgba(${cfg.r}, ${cfg.g}, ${cfg.b}, 0.3) 0%, transparent 70%)`;

            
            const buttons = document.querySelectorAll('.state-btn');
            buttons.forEach(btn => {
                
                btn.className = 'state-btn relative flex flex-col items-center justify-center py-3 px-2 rounded-lg border border-transparent text-neutral-500 hover:text-neutral-300 hover:bg-white/5 transition-all duration-200';
            });

            
            const activeBtn = document.getElementById(`btn-${state}`);
            activeBtn.className = `state-btn relative flex flex-col items-center justify-center py-3 px-2 rounded-lg border transition-all duration-200 ${cfg.btnBorder} ${cfg.btnBg} ${cfg.colorClass}`;
        };

        
        function animate(time) {
            const t = time / 1000; 
            const cfg = config[currentState];

            dots.forEach(dot => {
                let intensity = 0;
                const baseOpacity = 0.05; 

                switch (currentState) {
                    case 'standby':
                        
                        const pulseWave = Math.sin(dot.d * 0.4 - t * 2.5);
                        const pulseEnvelope = Math.max(0, 1 - dot.d / 12);
                        intensity = Math.max(0, pulseWave) * pulseEnvelope * 0.8;
                        break;

                    case 'thinking':
                        
                        const numArms = 3;
                        const spiralSpeed = 5;
                        const spiralTightness = 0.6;
                        const spiralValue = Math.sin(dot.a * numArms + dot.d * spiralTightness - t * spiralSpeed);
                        const spiralEnvelope = Math.max(0, 1 - dot.d / 14);
                        
                        intensity = spiralValue > 0.4 ? spiralValue * spiralEnvelope : 0;
                        break;

                    case 'listening':
                        
                        const rippleFreq = 1.5;
                        const rippleSpeed = 6;
                        const rippleValue = Math.sin(dot.d * rippleFreq - t * rippleSpeed);
                        
                        intensity = rippleValue > 0.85 ? 1 : 0;
                        
                        if (dot.d < 1.5) {
                            intensity = Math.max(intensity, Math.sin(t * 8) * 0.5 + 0.5);
                        }
                        
                        intensity *= Math.max(0, 1 - dot.d / 12);
                        break;

                    case 'alert':
                        
                        const fastT = t * 15;
                        const manhattanDist = Math.abs(dot.x) + Math.abs(dot.y);
                        
                        
                        const alertWave = Math.sin(manhattanDist - fastT * 0.5);
                        
                        
                        const isCrosshair = Math.abs(dot.x) === 0 || Math.abs(dot.y) === 0;
                        const crossPulse = Math.sin(fastT * 0.5) > 0;

                        if (isCrosshair && crossPulse) {
                            intensity = 1;
                        } else if (alertWave > 0.7) {
                            intensity = 0.6;
                        }

                        
                        if (Math.random() < 0.03) intensity = Math.random();
                        
                        
                        if (dot.d > 12) intensity = 0;
                        break;
                }

                
                const finalOpacity = baseOpacity + intensity;
                const r = cfg.r;
                const g = cfg.g;
                const b = cfg.b;

                dot.el.style.backgroundColor = `rgba(${r}, ${g}, ${b}, ${finalOpacity})`;
                
                
                if (intensity > 0.3) {
                    dot.el.style.boxShadow = `0 0 ${intensity * 10}px rgba(${r}, ${g}, ${b}, ${intensity})`;
                } else {
                    dot.el.style.boxShadow = 'none';
                }
            });

            requestAnimationFrame(animate);
        }

        
        requestAnimationFrame(animate);
    </script>

</body></html>
