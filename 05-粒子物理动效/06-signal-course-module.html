        .module-card:hover {

        .module-card::before {

        .orbital-icon {

        .dot {

            gap: 0.5rem;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .back-nav:hover {
            color: #fff;
        }
    </style>
</head>

    <script vid="77">
        const canvas = document.getElementById('nebulaCanvas');
        const ctx = canvas.getContext('2d', { alpha: false }); 
        
        let width, height, cx, cy;
        let particles = [];
        const PARTICLE_COUNT = 1500; 
        let time = 0;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            cx = width / 2;
            cy = height / 2;
        }

        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.init();
                this.angle = Math.random() * Math.PI * 2;
            }

            init() {
                const distanceBias = Math.pow(Math.random(), 2.5);
                this.radius = distanceBias * (width * 0.7); 
                this.angle = Math.random() * Math.PI * 2;
                this.baseSpeed = (Math.random() * 0.001 + 0.0003) * (1000 / (this.radius + 200));
                this.speed = this.baseSpeed;
                this.baseSize = Math.random() * 0.8 + 0.1;
                
                const colorType = Math.random();
                let r, g, b;
                if (colorType < 0.7) {
                    r = 255; g = 255; b = 255;
                } else if (colorType < 0.9) {
                    r = 160; g = 190; b = 255;
                } else {
                    r = 120; g = 140; b = 255;
                }
                const alpha = Math.random() * 0.4 + 0.2;
                this.color = `rgba(${r}, ${g}, ${b}, ${alpha})`;
            }

            update() {
                this.angle += this.speed;
            }

            draw() {
                const twist = this.radius * 0.002;
                const a = this.angle + twist;
                const x = Math.cos(a) * this.radius;
                const z = Math.sin(a) * this.radius;
                const warp = Math.sin(this.angle * 2) * (this.radius * 0.2);
                const tilt = 0.15;
                const y = z * tilt + warp;

                const drawX = cx + x;
                const drawY = cy + y;

                if (drawX > 0 && drawX < width && drawY > 0 && drawY < height) {
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(drawX, drawY, this.baseSize, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        for (let i = 0; i < PARTICLE_COUNT; i++) {
            particles.push(new Particle());
        }

        function drawCentralGlow() {
            const coreGradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, 300);
            coreGradient.addColorStop(0, 'rgba(20, 30, 80, 0.4)');
            coreGradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.globalCompositeOperation = 'lighter';
            ctx.fillStyle = coreGradient;
            ctx.fillRect(cx - 400, cy - 400, 800, 800);
        }

        function animate() {
            time += 0.005;
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = '#030613';
            ctx.fillRect(0, 0, width, height);

            ctx.globalCompositeOperation = 'lighter';
            drawCentralGlow();

            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
