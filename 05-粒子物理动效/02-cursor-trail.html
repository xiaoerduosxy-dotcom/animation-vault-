<html lang="en" vid="0"><head vid="1">

    <style vid="6">
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Inter:wght@300;400&display=swap');
        
        :root {
            --bg-color: #030303;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: var(--bg-color);
            color: white;
            font-family: 'Inter', sans-serif;
            cursor: crosshair; 
        }

        
        .bg-gradient-radial {
            background: radial-gradient(circle at center, #14110d 0%, var(--bg-color) 100%);
        }

        .title-font {
            font-family: 'Cinzel', serif;
        }

        #trail-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none; 
            z-index: 50;
        }

        
        .fade-in {
            animation: fadeIn 2s ease-out forwards;
            opacity: 0;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .delay-1 { animation-delay: 0.5s; }
        .delay-2 { animation-delay: 1s; }
        .delay-3 { animation-delay: 1.5s; }
    </style>
</head>

    <canvas id="trail-canvas" vid="38"></canvas>

    <script vid="39">
        const canvas = document.getElementById('trail-canvas');
        const ctx = canvas.getContext('2d', { alpha: true });
        
        let width, height;
        let particles = [];
        let mouse = { x: null, y: null };
        let prevMouse = { x: null, y: null };

        
        const LIFESPAN_FRAMES = 60; 
        const SPACING_DENSITY = 2; 
        const BASE_PARTICLE_SIZE = 6; 

        
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            const dpr = window.devicePixelRatio || 1;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
        }

        window.addEventListener('resize', resize);
        resize();

        
        class Particle {
            constructor(x, y) {
                
                
                this.x = x + (Math.random() - 0.5) * 2;
                this.y = y + (Math.random() - 0.5) * 2;
                
                this.life = LIFESPAN_FRAMES;
                this.maxLife = LIFESPAN_FRAMES;
                
                
                this.radius = BASE_PARTICLE_SIZE + (Math.random() * 2);
                
                
                
                this.vx = (Math.random() - 0.5) * 0.3;
                this.vy = (Math.random() - 0.5) * 0.3;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life--; 
            }

            draw(ctx) {
                if (this.life <= 0) return;

                
                const progress = this.life / this.maxLife; 
                
                
                const sizeProgress = progress; 
                
                
                
                const alphaProgress = Math.pow(progress, 3); 

                const currentRadius = this.radius * sizeProgress;
                
                
                if (currentRadius <= 0.2) return;

                
                
                ctx.globalCompositeOperation = 'screen';

                
                
                
                ctx.beginPath();
                ctx.arc(this.x, this.y, currentRadius * 3.5, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(184, 134, 11, ${alphaProgress * 0.1})`; 
                ctx.fill();

                
                ctx.beginPath();
                ctx.arc(this.x, this.y, currentRadius * 2.0, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(218, 165, 32, ${alphaProgress * 0.3})`; 
                ctx.fill();
                
                
                ctx.beginPath();
                ctx.arc(this.x, this.y, currentRadius * 1.0, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 215, 0, ${alphaProgress * 0.6})`; 
                ctx.fill();

                
                ctx.beginPath();
                ctx.arc(this.x, this.y, currentRadius * 0.3, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 250, 230, ${alphaProgress * 0.9})`; 
                ctx.fill();
            }
        }

        
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;

            
            
            
            
            if (prevMouse.x !== null && prevMouse.y !== null) {
                const dx = mouse.x - prevMouse.x;
                const dy = mouse.y - prevMouse.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                
                const steps = Math.ceil(dist / SPACING_DENSITY);

                
                for (let i = 0; i < steps; i++) {
                    const px = prevMouse.x + (dx * (i / steps));
                    const py = prevMouse.y + (dy * (i / steps));
                    particles.push(new Particle(px, py));
                }
            } else {
                
                particles.push(new Particle(mouse.x, mouse.y));
            }

            
            prevMouse.x = mouse.x;
            prevMouse.y = mouse.y;
        });

        
        window.addEventListener('mouseout', () => {
            prevMouse.x = null;
            prevMouse.y = null;
        });
        
        
        window.addEventListener('mouseenter', (e) => {
            prevMouse.x = e.clientX;
            prevMouse.y = e.clientY;
        });

        
        function animate() {
            
            ctx.globalCompositeOperation = 'source-over';
            ctx.clearRect(0, 0, width, height);

            
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw(ctx);
            }

            
            particles = particles.filter(p => p.life > 0);

            
            requestAnimationFrame(animate);
        }

        
        animate();
    </script>
